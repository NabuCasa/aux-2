# Factory build/signing target for production hardware. Basename = Autograph
# target id + fleet OTA channel path; renaming needs re-registration and orphans
# the old channel.
packages:
  core: !include packages/aux-2.yaml
  factory: !include packages/factory.yaml

# ewt-gen reads the device name from this file only (packages are not
# resolved); must match the name in the core package.
esphome:
  name: connect-aux-2

substitutions:
  fw_manifest_base: https://firmware.nabucasa.com/aux-2

# Factory firmware only — adopted user configs (the core package) must not
# re-advertise adoption.
dashboard_import:
  package_import_url: github://NabuCasa/aux-2/packages/aux-2.yaml@main
