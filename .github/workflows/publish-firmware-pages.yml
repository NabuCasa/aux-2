name: Publish firmware pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Generate sites with ewt-gen
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          configs=(*.yaml)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "No config files found."
            exit 1
          fi

          mkdir -p site
          for config in "${configs[@]}"; do
            name="$(basename "${config%.*}")"
            echo "Generating page for $config"
            uvx ewt-gen --pre-release "$config" -o "site/$name"
          done

          {
            echo '<!doctype html>'
            echo '<html><head><meta charset="utf-8"><title>Firmware pages</title></head><body>'
            echo '<h1>Firmware pages</h1><ul>'
            for config in "${configs[@]}"; do
              name="$(basename "${config%.*}")"
              echo "<li><a href=\"./$name/\">$name</a></li>"
            done
            echo '</ul></body></html>'
          } > site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
