# Compiles each config on pull requests so a broken build can't merge. No
# credentials: the placeholder-digest trust anchor (FW_ENV=pr) is used and
# nothing is uploaded.

name: Build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Selects packages/trust-anchor-pr.yaml (placeholder digests).
      FW_ENV: pr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Build with the same ESPHome commit as the release workflow.
          esphome_ref="$(sed -nE 's/^ *ESPHOME_REF: *([0-9a-f]+).*/\1/p' .github/workflows/upload-unsigned-firmware.yml)"
          if [ -z "$esphome_ref" ]; then
            echo "ESPHOME_REF not found in upload-unsigned-firmware.yml" >&2
            exit 1
          fi

          configs=()
          for config in *.yaml; do
            configs+=("$config")
          done
          if [ ${#configs[@]} -eq 0 ]; then
            echo "No config files found."
            exit 1
          fi

          for config in "${configs[@]}"; do
            echo "Building $config (ESPHome ${esphome_ref})"
            uvx --from "git+https://github.com/esphome/esphome.git@${esphome_ref}" \
              esphome compile "$config"
          done

  # What "take control" produces must build with the latest ESPHome release.
  build-adopted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build the adopted configuration
        shell: bash
        run: |
          set -euo pipefail
          # Mirrors the config the ESPHome Device Builder writes on adoption.
          cat > adopted-test.yaml <<'EOF'
          packages:
            aux_2: !include packages/aux-2.yaml
          wifi:
            ssid: test-ssid
            password: test-password
          EOF
          uvx esphome version
          uvx esphome compile adopted-test.yaml
