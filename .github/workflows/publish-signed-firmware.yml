# Post-sign publisher. Run manually after an Autograph operator has reviewed
# and signed a build in the selected environment (staging or prod). Dispatch
# staging publishes on main and prod publishes ON THE RELEASE TAG (the prod
# WIF provider only mints tokens for tag refs). For each config it:
#
#   1. downloads firmware.signed.ota.bin + manifest.json from that
#      environment's signed bucket (direct GETs — the prefix-scoped read
#      grant does not allow listing);
#   2. recomputes the SHA-256 against the manifest's signed_sha256;
#   3. verifies the Secure Boot v2 signatures against BOTH signing keys
#      (GCP KMS and the AWS backup key), each pinned by fingerprint;
#   4. assembles firmware.signed.factory.bin by merging the signed app with
#      the boot components retained by the unsigned build for the SAME commit
#      (Autograph never builds factory images — only the app is signed);
#   5. extracts the app back out of the factory image and re-verifies it;
#   6. publishes the verified artifacts to the S3 serving layer
#      (firmware.nabucasa.com): permanent versioned paths plus this
#      channel's mutable pointer manifest; and
#   7. rebuilds this environment's half of the firmware pages and deploys
#      (TRANSITION: Pages remains the live channel until firmware baking
#      firmware.nabucasa.com URLs ships; then this step is removed).
#
# Site layout: the deployed site is /staging/<config>/ + /prod/<config>/ ONLY.
# Root-level config paths are not served (the pre-split legacy mirror is
# retired; that fleet is orphaned by the target rename). Because a Pages
# deploy replaces the whole site, the assembled site persists on the
# machine-managed `pages-site` branch: each publish refreshes only its
# environment's subtree, commits the merged result, and deploys that.
#
# Never combine a signed app with boot components from a different build:
# environment, version, commit, and boot_run_id must all refer to the same
# unsigned build (its step summary prints the exact values to use here).
#
# There are no GitHub secrets: bucket read is via Workload Identity
# Federation, and the artifact download uses the built-in GITHUB_TOKEN.

name: Publish signed firmware pages

run-name: Publish signed ${{ inputs.environment }} ${{ inputs.version }} (${{ inputs.commit }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Signing environment the build was uploaded to and signed in"
        required: true
        type: choice
        options:
          - staging
          - prod
      version:
        description: "Release version — the <version> path segment in the buckets (staging: e.g. 2026.07.29.8; prod: the release tag, e.g. 2026.8.0)"
        required: true
      commit:
        description: "Full commit SHA the build was produced from"
        required: true
      boot_run_id:
        description: "Run ID of the unsigned build holding the boot-<commit> artifact"
        required: true

# id-token: write mints the OIDC token exchanged for scoped bucket/KMS reads
# (GCP WIF and the AWS role); actions: read lets `gh run download` fetch the
# boot-component artifact; contents: write pushes the assembled site to the
# machine-managed pages-site branch; pages: write deploys it.
permissions:
  contents: write
  id-token: write
  pages: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CHIP: esp32s3
  FW_ENV: ${{ github.event.inputs.environment }}
  # Environment-routed values from repo-level Actions variables
  # (FW_STAGING_* / FW_PROD_*). Deliberately NOT GitHub Environments:
  # attaching `environment:` to a job changes the OIDC token's subject claim
  # from ref-based to environment-based, which the ref-restricted WIF
  # providers (prod: tags only) would reject.
  PROJECT_ID: ${{ github.event.inputs.environment == 'prod' && vars.FW_PROD_PROJECT_ID || vars.FW_STAGING_PROJECT_ID }}
  SIGNED_BUCKET: ${{ github.event.inputs.environment == 'prod' && vars.FW_PROD_SIGNED_BUCKET || vars.FW_STAGING_SIGNED_BUCKET }}
  WIF_PROVIDER: ${{ github.event.inputs.environment == 'prod' && vars.FW_PROD_WIF_PROVIDER || vars.FW_STAGING_WIF_PROVIDER }}
  # Every release must verify against BOTH signing keys (Autograph
  # dual-signs): the GCP KMS key and the AWS backup key. Devices only trust
  # the keys carried in their running app's signature sector, so publishing
  # a single-signed image would shrink the fleet's trust set to that one
  # key. Each public key is pinned to the SHA-256 of its DER encoding so a
  # wrong environment or an unexpected rotation fails loudly. The pins are
  # trust anchors and stay IN THIS FILE (git-reviewed), not in variables.
  #
  # GCP: the public half is fetched at run time (requires
  # roles/cloudkms.publicKeyViewer on the key for this repo's WIF principal).
  # Prod key is `aux-2-active` (active/next rotation naming). Prod
  # fingerprint per bbangert 2026-07-30, pending out-of-band confirmation.
  KMS_LOCATION: europe-west1
  KMS_KEYRING: firmware-signing
  KMS_KEY: ${{ github.event.inputs.environment == 'prod' && vars.FW_PROD_KMS_KEY || vars.FW_STAGING_KMS_KEY }}
  KMS_KEY_VERSION: "1"
  GCP_PUBKEY_DER_SHA256: ${{ github.event.inputs.environment == 'prod' && '387378c709403303949ed586f3d0534a9504977be2eba48c9e9c2a12395ecdb4' || '79e2479bb06ba42787e7c1fa8cfa8bc82dc618c08ffdd0198dca6d86619f1072' }}
  # AWS: the public half is fetched at run time via an OIDC-assumed role
  # whose only permission is kms:GetPublicKey on this key. Prod and staging
  # now use separate AWS backup keys (the first-run bridge, where prod images
  # were backed by the staging AWS key, is complete). Prod fingerprint is the
  # DER-SHA256 of aux-2-signing-prod-backup.
  AWS_REGION: ${{ github.event.inputs.environment == 'prod' && vars.FW_PROD_AWS_REGION || vars.FW_STAGING_AWS_REGION }}
  AWS_ROLE_ARN: ${{ github.event.inputs.environment == 'prod' && vars.FW_PROD_AWS_ROLE_ARN || vars.FW_STAGING_AWS_ROLE_ARN }}
  AWS_KMS_KEY_ARN: ${{ github.event.inputs.environment == 'prod' && vars.FW_PROD_AWS_KMS_KEY_ARN || vars.FW_STAGING_AWS_KMS_KEY_ARN }}
  AWS_PUBKEY_DER_SHA256: ${{ github.event.inputs.environment == 'prod' && 'f2ae0b5a8dbe32a6d728d26c09cfe5a645ef9a78a6612db06df8280c69a43582' || '89fd2ca82e7206de45ad5a64764b093a53e53db1cfab50776b2eea0630d640d7' }}
  # S3 serving layer (HDW-816): shared bucket behind firmware.nabucasa.com.
  # The publishing role's trust admits main + tag refs only and can write
  # only under the aux-2/ prefix.
  S3_PUBLISH_ROLE: arn:aws:iam::330564535865:role/gha-aux-2-s3
  S3_PUBLISH_REGION: us-east-1
  S3_BASE: s3://nc-esp32-firmware/aux-2

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Prod tokens only mint on tag refs (WIF provider condition), so a prod
      # publish must be dispatched ON the release tag:
      #   gh workflow run publish-signed-firmware.yml --ref <tag> ...
      # Staging publishes dispatch on main. Fail fast with a clear message
      # instead of a cryptic STS error at the auth step. Also fail loudly on
      # unset repo Actions variables — they're invisible to PR review.
      - name: Check dispatch ref and environment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "${FW_ENV}" = "prod" ] && [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "prod publishes must be dispatched on the release tag, not '${GITHUB_REF}'" >&2
            echo "(the prod WIF provider only mints tokens for refs/tags/*):" >&2
            echo "  gh workflow run publish-signed-firmware.yml --ref <tag> -f environment=prod ..." >&2
            exit 1
          fi
          for v in PROJECT_ID SIGNED_BUCKET WIF_PROVIDER KMS_KEY AWS_REGION AWS_ROLE_ARN AWS_KMS_KEY_ARN; do
            if [ -z "${!v}" ]; then
              echo "Missing repo Actions variable for ${FW_ENV} ${v} (FW_$(echo "${FW_ENV}" | tr a-z A-Z)_…)" >&2
              exit 1
            fi
          done

      # The configs and public key must come from the exact commit that was
      # built and signed, not from the current main.
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}

      # The previously published site — this publish replaces only the
      # ${FW_ENV} subtree and re-deploys the merged whole.
      - name: Checkout published site state
        uses: actions/checkout@v4
        with:
          ref: pages-site
          path: .site-state

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Authenticate to Google Cloud (WIF, no keys)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: Authenticate to AWS (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch and pin the verification public keys
        run: |
          set -euo pipefail
          gcloud kms keys versions get-public-key "${KMS_KEY_VERSION}" \
            --project "${PROJECT_ID}" \
            --location "${KMS_LOCATION}" \
            --keyring "${KMS_KEYRING}" \
            --key "${KMS_KEY}" \
            --output-file signing_pubkey.pem
          actual=$(openssl pkey -pubin -in signing_pubkey.pem -outform DER | sha256sum | cut -d' ' -f1)
          if [ "$actual" != "${GCP_PUBKEY_DER_SHA256}" ]; then
            echo "GCP public key fingerprint mismatch — refusing to verify against it" >&2
            echo "expected=${GCP_PUBKEY_DER_SHA256}" >&2
            echo "actual  =${actual}" >&2
            exit 1
          fi
          # AWS KMS returns the public key as base64-encoded DER — the
          # fingerprint is the SHA-256 of exactly those DER bytes.
          aws kms get-public-key --key-id "${AWS_KMS_KEY_ARN}" \
            --query PublicKey --output text | base64 -d > aws_signing_pubkey.der
          actual_aws=$(sha256sum aws_signing_pubkey.der | cut -d' ' -f1)
          if [ "$actual_aws" != "${AWS_PUBKEY_DER_SHA256}" ]; then
            echo "AWS public key fingerprint mismatch — refusing to verify against it" >&2
            echo "expected=${AWS_PUBKEY_DER_SHA256}" >&2
            echo "actual  =${actual_aws}" >&2
            exit 1
          fi
          openssl pkey -pubin -inform DER -in aws_signing_pubkey.der \
            -out aws_signing_pubkey.pem

      # The release configs reference the trust-anchor digests via !secret, so
      # ESPHome must resolve them when the site is rebuilt (even under
      # --skip-compile, which never rebuilds firmware — the signed image is used
      # as-is). Derive the digests from the public keys just fetched (the same
      # values the build baked in) and write secrets.yaml; it is excluded from
      # the config globs below.
      - name: Write signing-key trust anchor (secrets.yaml)
        shell: bash
        run: |
          set -euo pipefail
          uvx --from esptool espsecure digest-sbv2-public-key \
            --keyfile signing_pubkey.pem --output gcp_digest.bin
          uvx --from esptool espsecure digest-sbv2-public-key \
            --keyfile aws_signing_pubkey.pem --output aws_digest.bin
          cat > secrets.yaml <<EOF
          fw_key_digest_gcp: "$(od -An -v -tx1 gcp_digest.bin | tr -d ' \n')"
          fw_key_digest_aws: "$(od -An -v -tx1 aws_digest.bin | tr -d ' \n')"
          EOF

      - name: Download boot components from the unsigned build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ github.event.inputs.boot_run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            -n "boot-${{ github.event.inputs.commit }}" \
            -D boot

      - name: Download, verify, and assemble signed firmware
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
          COMMIT: ${{ github.event.inputs.commit }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          configs=()
          for config in *.yaml; do
            # secrets.yaml holds the trust anchor, not a device config.
            [[ "$config" == secrets.yaml ]] && continue
            configs+=("$config")
          done
          if [ ${#configs[@]} -eq 0 ]; then
            echo "No config files found."
            exit 1
          fi

          # Start from the previously published site and replace only this
          # environment's subtree. Root-level config dirs are legacy (retired
          # pre-split mirror) — prune any that persist in the site state.
          mkdir -p site signed
          rsync -a --exclude=.git .site-state/ site/
          rm -rf "site/${FW_ENV}"
          mkdir -p "site/${FW_ENV}"
          find site -mindepth 1 -maxdepth 1 -type d ! -name staging ! -name prod -exec rm -rf {} +

          for config in "${configs[@]}"; do
            name="$(basename "${config%.*}")"
            base="${name}/${VERSION}/${COMMIT}"
            out="signed/$name"
            mkdir -p "$out"

            echo "Fetching signed artifacts for $name (${FW_ENV})"
            gcloud storage cp "gs://${SIGNED_BUCKET}/${base}/firmware.signed.ota.bin" "$out/firmware.signed.ota.bin"
            gcloud storage cp "gs://${SIGNED_BUCKET}/${base}/manifest.json" "$out/manifest.json"

            # Gate 1: recompute the signed digest against the manifest.
            expected=$(jq -r '.signed_sha256 // empty' "$out/manifest.json")
            actual=$(sha256sum "$out/firmware.signed.ota.bin" | cut -d' ' -f1)
            if [ -z "$expected" ]; then
              echo "Manifest for $name is missing signed_sha256" >&2
              exit 1
            fi
            if [ "$expected" != "$actual" ]; then
              echo "SHA-256 mismatch for $name — refusing to publish" >&2
              echo "expected=$expected" >&2
              echo "actual  =$actual" >&2
              exit 1
            fi

            # Gate 2: Secure Boot v2 signatures — the image must verify
            # against BOTH pinned keys (see the env block for why a
            # single-signed release must never be published).
            uvx --from esptool espsecure verify-signature --version 2 \
              --keyfile signing_pubkey.pem "$out/firmware.signed.ota.bin"
            uvx --from esptool espsecure verify-signature --version 2 \
              --keyfile aws_signing_pubkey.pem "$out/firmware.signed.ota.bin"

            # Assemble the factory image: merge the signed app with the boot
            # components from the same build, using the offsets and flash
            # settings recorded in that build's flasher_args.json.
            fa="boot/$name/flasher_args.json"
            if [ ! -f "$fa" ]; then
              echo "Boot components for $name are missing flasher_args.json" >&2
              exit 1
            fi
            app_offset=$(jq -r '.app.offset' "$fa")
            merge_args=()
            while read -r offset file; do
              if [ "$offset" = "$app_offset" ]; then
                merge_args+=( "$offset" "$out/firmware.signed.ota.bin" )
              else
                merge_args+=( "$offset" "boot/$name/$file" )
              fi
            done < <(jq -r '.flash_files | to_entries[] | "\(.key) \(.value)"' "$fa")
            uvx --from esptool esptool --chip "${CHIP}" merge-bin \
              -o "$out/firmware.signed.factory.bin" \
              --flash-mode "$(jq -r '.flash_settings.flash_mode' "$fa")" \
              --flash-freq "$(jq -r '.flash_settings.flash_freq' "$fa")" \
              --flash-size "$(jq -r '.flash_settings.flash_size' "$fa")" \
              "${merge_args[@]}"

            # Gate 3: extract the app back out of the factory image and
            # re-verify its signatures before publishing anything.
            if [ $(( app_offset % 4096 )) -ne 0 ]; then
              echo "App offset $app_offset is not 4 KiB aligned" >&2
              exit 1
            fi
            dd if="$out/firmware.signed.factory.bin" of="$out/app-extracted.bin" \
              bs=4096 skip=$(( app_offset / 4096 )) status=none
            uvx --from esptool espsecure verify-signature --version 2 \
              --keyfile signing_pubkey.pem "$out/app-extracted.bin"
            uvx --from esptool espsecure verify-signature --version 2 \
              --keyfile aws_signing_pubkey.pem "$out/app-extracted.bin"

            # Rebuild this config's firmware page around the SIGNED binaries:
            # ewt-gen picks up <config>.factory.bin / <config>.ota.bin before
            # looking in build directories, and --skip-compile uses them
            # as-is. --dev is still required: even without compiling, ewt-gen
            # resolves the config through ESPHome, and the configs need the
            # same ESPHome flavor they were built with.
            cp "$out/firmware.signed.factory.bin" "${config%.*}.factory.bin"
            cp "$out/firmware.signed.ota.bin" "${config%.*}.ota.bin"
            uvx ewt-gen --dev --skip-compile "$config" \
              -t "$name" \
              -o "site/${FW_ENV}/$name" \
              --publish-url "${PAGES_BASE_URL%/}/${FW_ENV}/$name" \
              --fw-version "${VERSION}"
          done

          # Environment index
          {
            echo '<!doctype html>'
            echo "<html><head><meta charset=\"utf-8\"><title>Firmware pages (${FW_ENV})</title><meta name=\"viewport\" content=\"width=device-width\"><style>li { margin: 4px 0 }</style></head><body>"
            echo "<h1>Firmware pages (${FW_ENV})</h1><ul>"
            for config in "${configs[@]}"; do
              name="$(basename "${config%.*}")"
              echo "<li><a href=\"./$name/\">$name</a></li>"
            done
            echo '</ul></body></html>'
          } > "site/${FW_ENV}/index.html"

          # Root index: link whichever environments have been published.
          {
            echo '<!doctype html>'
            echo '<html><head><meta charset="utf-8"><title>Firmware pages</title><meta name="viewport" content="width=device-width"><style>li { margin: 4px 0 }</style></head><body>'
            echo '<h1>Firmware pages</h1><ul>'
            for envdir in staging prod; do
              if [ -d "site/$envdir" ]; then
                echo "<li><a href=\"./$envdir/\">$envdir</a></li>"
              fi
            done
            echo '</ul></body></html>'
          } > site/index.html

      # Everything below needing AWS switches identity: the pubkey-reader
      # credentials are no longer required (keys already fetched and pinned),
      # and the S3 publishing role can only write under the aux-2/ prefix.
      - name: Authenticate to AWS for artifact publishing (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.S3_PUBLISH_ROLE }}
          aws-region: ${{ env.S3_PUBLISH_REGION }}

      # Layout (firmware.esphome.io convention, HDW-816): artifacts live at
      # permanent versioned paths; each channel is a mutable pointer manifest
      # beside them (prod -> manifest.json, staging -> manifest-staging.json).
      # Promotion/rollback = rewriting the pointer; binaries are never moved.
      # The pre-prod hardware target has no prod channel — its versioned
      # artifacts are still archived on prod publishes.
      - name: Publish artifacts and channel manifest to S3
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          for config in *.yaml; do
            [[ "$config" == secrets.yaml ]] && continue
            # ewt-gen wrote derived <config>.factory.yaml files in the site
            # step above; they are not device configs.
            [[ "$config" == *.factory.yaml ]] && continue
            name="$(basename "${config%.*}")"
            out="signed/$name"
            dest="${S3_BASE}/${name}"

            core_pkg="$(sed -n 's/^[[:space:]]*core:[[:space:]]*!include[[:space:]]*//p' "$config" | head -1)"
            project_name="$(sed -n 's/^    name: //p' "$core_pkg" | head -1)"
            if [ -z "$project_name" ]; then
              echo "Could not resolve esphome.project.name from $core_pkg" >&2
              exit 1
            fi

            PROJECT_NAME="$project_name" \
            OTA_MD5="$(md5sum "$out/firmware.signed.ota.bin" | cut -d' ' -f1)" \
            OTA_SHA256="$(sha256sum "$out/firmware.signed.ota.bin" | cut -d' ' -f1)" \
            FACTORY_MD5="$(md5sum "$out/firmware.signed.factory.bin" | cut -d' ' -f1)" \
            FACTORY_SHA256="$(sha256sum "$out/firmware.signed.factory.bin" | cut -d' ' -f1)" \
            python3 - > "$out/channel-manifest.json" <<'PY'
          import json, os
          v = os.environ["VERSION"]
          print(json.dumps({
              "name": os.environ["PROJECT_NAME"],
              "version": v,
              "home_assistant_domain": "esphome",
              "new_install_prompt_erase": False,
              "builds": [{
                  "chipFamily": "ESP32-S3",
                  "ota": {
                      "path": f"{v}/firmware-esp32s3.ota.bin",
                      "md5": os.environ["OTA_MD5"],
                      "sha256": os.environ["OTA_SHA256"],
                      "release_url": f"https://github.com/NabuCasa/aux-2/commit/{os.environ['COMMIT']}",
                  },
                  "parts": [{
                      "path": f"{v}/firmware-esp32s3.factory.bin",
                      "offset": 0,
                      "md5": os.environ["FACTORY_MD5"],
                      "sha256": os.environ["FACTORY_SHA256"],
                  }],
              }],
          }, indent=2))
          PY

            echo "Uploading $name ${VERSION} artifacts"
            aws s3 cp "$out/firmware.signed.ota.bin" "$dest/${VERSION}/firmware-esp32s3.ota.bin"
            aws s3 cp "$out/firmware.signed.factory.bin" "$dest/${VERSION}/firmware-esp32s3.factory.bin"

            if [ "${FW_ENV}" = "prod" ]; then
              channel_manifest=""
              [ "$name" = "connect-aux-2" ] && channel_manifest="manifest.json"
            else
              channel_manifest="manifest-staging.json"
            fi
            if [ -n "$channel_manifest" ]; then
              echo "Promoting $name ${channel_manifest} -> ${VERSION}"
              aws s3 cp "$out/channel-manifest.json" "$dest/${channel_manifest}" \
                --content-type application/json --cache-control no-cache
            fi
          done

      # Persist the merged site so the next publish (either environment)
      # starts from it.
      - name: Persist site state to pages-site branch
        env:
          VERSION: ${{ github.event.inputs.version }}
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git site/ .site-state/
          cd .site-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${FW_ENV} ${VERSION} (${COMMIT})" || echo "Site unchanged"
          git push origin HEAD:pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish summary
        env:
          VERSION: ${{ github.event.inputs.version }}
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          shopt -s nullglob
          {
            echo "## Signed firmware verified & assembled (${FW_ENV})"
            echo ""
            for config in *.yaml; do
              [[ "$config" == *.factory.yaml ]] && continue
              [[ "$config" == secrets.yaml ]] && continue
              name="$(basename "${config%.*}")"
              echo "- \`$name\` ${VERSION} (${COMMIT}) — dual signatures verified, factory image assembled → /${FW_ENV}/$name/"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
