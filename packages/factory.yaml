# Update channel: CI sets FW_CHANNEL_MANIFEST (manifest.json on prod/tag
# builds); the default keeps local and staging builds on the staging channel.
substitutions:
  fw_channel_manifest: !env_var FW_CHANNEL_MANIFEST manifest-staging.json

esp32:
  framework:
    advanced:
      # Compiled-in OTA trust anchor; key digests are derived from KMS and
      # written to secrets.yaml at build time (upload-unsigned-firmware.yml).
      signed_ota_verification:
        signing_scheme: rsa3072
        verification_keys:
          - !secret fw_key_digest_gcp
          - !secret fw_key_digest_aws
      enable_ota_downgrade_protection: true

esp32_improv:
  id: esp32_improv_component
  authorizer: none

improv_serial:
  id: improv_serial_component

provisioning:
  id: provisioning_component
  timeout: 15min

# Shown by Home Assistant when the device is added; adopted configs don't need it.
api:
  wizard:
    pages:
      - title: Bluetooth
        description: Choose whether this device offers Bluetooth. You can change this later in the device's settings.
        entities:
          - id: bluetooth_switch
            description: Proxies nearby Bluetooth devices to Home Assistant.
      - title: Sendspin
        description: Choose how this device works with Sendspin. You can change this later in the device's settings.
        entities:
          - id: sendspin_switch
            description: Lets Sendspin servers, such as Music Assistant, play audio on this device.
          - id: sendspin_unpaired_access_switch
            description: Lets Sendspin servers play without pairing first. Turn off to allow only paired servers.

ota:
  # Factory firmware updates only via the signed http_request channel; no
  # network OTA endpoint. Adopted configs keep the core's esphome OTA.
  - id: !remove esphome_ota
  - platform: http_request
    id: ota_http_request

update:
  - platform: http_request
    id: update_http_request
    name: Firmware
    source: ${fw_manifest_base}/${fw_channel_manifest}
