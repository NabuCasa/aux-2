esphome:
  on_boot:
    # List form: concatenates with the core package's on_boot automation
    # instead of deep-merging into it (which would clobber its priority).
    - priority: -100.0
      then:
        - script.execute: install_update_on_boot

esp32:
  framework:
    advanced:
      # Compiled-in OTA trust anchor; key digests are derived from KMS and
      # written to secrets.yaml at build time (upload-unsigned-firmware.yml).
      signed_ota_verification:
        signing_scheme: rsa3072
        verification_keys:
          - !secret fw_key_digest_gcp
          - !secret fw_key_digest_aws
      enable_ota_downgrade_protection: true

esp32_improv:
  id: esp32_improv_component
  authorizer: none

improv_serial:
  id: improv_serial_component

provisioning:
  timeout: 15min

external_components:
  - source: github://pr#17598
    components: [improv_serial]
    refresh: always

script:
  # Install any pending firmware update once the network is up.
  # update_http_request is defined by the ewt-gen-generated wrapper, so this
  # package only validates when compiled through it (CI always does).
  - id: install_update_on_boot
    then:
      - wait_until:
          condition:
            or:
              - wifi.connected:
              - ethernet.connected:
      - update.check: update_http_request
      - wait_until:
          condition:
            update.is_available: update_http_request
          timeout: 60s
      - if:
          condition:
            update.is_available: update_http_request
          then:
            - update.perform:
                id: update_http_request
