# Update channel: defaults to production; CI sets FW_CHANNEL_MANIFEST to the
# staging channel for staging builds (upload-unsigned-firmware.yml).
substitutions:
  fw_channel_manifest: !env_var FW_CHANNEL_MANIFEST manifest.json

# Maker and security contact for the firmware's SBOM. Factory firmware only:
# an adopted config is built by its owner, so Nabu Casa is not its supplier.
esphome:
  min_version: 2026.11.0
  project:
    sbom:
      supplier: Nabu Casa, Inc.
      contact: security@nabucasa.com
      url: https://www.nabucasa.com

# Need ESPHome changes not yet in a release, so adopted configs leave them out;
# move each to aux-2.yaml once a release has it.
# Zigbee proxy: esphome/esphome#20304
ezsp_proxy_tap:
  id: ezsp_proxy_tap_component
  serial_proxy_id: zigbee_serial_proxy

# 24-bit Sendspin: esphome/esphome#22313, pulled in so release builds have it
external_components:
  - source: github://pr#22313
    components: [sendspin]

media_source:
  - id: !extend sendspin_source
    bits_per_sample: 24

improv_ble:
  id: improv_ble_component
  authorizer: none

improv_serial:
  id: improv_serial_component

provisioning:
  id: provisioning_component
  timeout: 15min

ota:
  # Factory firmware updates only via the signed http_request channel; no
  # network OTA endpoint. Adopted configs keep the core's esphome OTA.
  - id: !remove esphome_ota
  - platform: http_request
    id: ota_http_request

update:
  - platform: http_request
    id: update_http_request
    name: Firmware
    source: ${fw_manifest_base}/${fw_channel_manifest}
