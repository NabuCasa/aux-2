esphome:
  on_boot:
    # List form: concatenates with the core package's on_boot automation
    # instead of deep-merging into it (which would clobber its priority).
    - priority: -100.0
      then:
        - script.execute: install_update_on_boot

esp32:
  framework:
    advanced:
      # Compiled-in OTA trust anchor; key digests are derived from KMS and
      # written to secrets.yaml at build time (upload-unsigned-firmware.yml).
      signed_ota_verification:
        signing_scheme: rsa3072
        verification_keys:
          - !secret fw_key_digest_gcp
          - !secret fw_key_digest_aws
      enable_ota_downgrade_protection: true

esp32_improv:
  id: esp32_improv_component
  authorizer: none

improv_serial:
  id: improv_serial_component

provisioning:
  timeout: 15min

external_components:
  - source: github://pr#17598
    components: [improv_serial]
    refresh: always

script:
  # Install any pending firmware update once the network is up. The update
  # entity only exists in the ewt-gen-generated wrapper (and only when built
  # with a version), so it is reached via USE_UPDATE-guarded lambdas: bare
  # configs — including ewt-gen's pre-wrap resolution pass — still validate
  # and compile, where this script becomes a no-op.
  - id: install_update_on_boot
    then:
      - wait_until:
          condition:
            or:
              - wifi.connected:
              - ethernet.connected:
      - lambda: |-
          #ifdef USE_UPDATE
          for (auto *u : App.get_updates())
            u->check();
          #endif
      - wait_until:
          condition:
            lambda: |-
              #ifdef USE_UPDATE
              for (auto *u : App.get_updates()) {
                if (u->state == update::UPDATE_STATE_AVAILABLE)
                  return true;
              }
              #endif
              return false;
          timeout: 60s
      - lambda: |-
          #ifdef USE_UPDATE
          for (auto *u : App.get_updates()) {
            if (u->state == update::UPDATE_STATE_AVAILABLE)
              u->perform();
          }
          #endif
