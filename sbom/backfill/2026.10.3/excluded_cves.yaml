# NimBLE is a git submodule of ESP-IDF's bt component and is listed for that reason only.
CVE-2026-45812:
  cpes:
    - cpe: cpe:2.3:a:apache:nimble:1.6.0:*:*:*:*:*:*:*
  justification: component_not_present
  reason: >-
    This firmware uses the Bluedroid Bluetooth host (CONFIG_BT_BLUEDROID_ENABLED=y); CONFIG_BT_NIMBLE_ENABLED is not set.
    No NimBLE source is compiled (0 of 291 objects of the bt component) and no NimBLE symbol is linked.
