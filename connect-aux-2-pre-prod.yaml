# Factory build/signing target for pre-production hardware. Basename = Autograph
# target id + fleet OTA channel path; renaming needs re-registration and orphans
# the old channel.
packages:
  core: !include packages/aux-2-pre-prod.yaml
  factory: !include packages/factory.yaml

# ewt-gen reads the device name from this file only (packages are not
# resolved); must match the name in the core package.
esphome:
  name: connect-aux-2

# Pre-production hardware has no prod channel — pinned to staging regardless
# of the build environment.
substitutions:
  fw_manifest_base: https://firmware.nabucasa.com/aux-2/connect-aux-2-pre-prod
  fw_channel_manifest: manifest-staging.json

# Factory firmware only — adopted user configs (the core package) must not
# re-advertise adoption.
dashboard_import:
  package_import_url: github://NabuCasa/aux-2/packages/aux-2-pre-prod.yaml@main
